name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag to publish"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - next
          - latest
      approval_scope:
        description: "Required explicit release approval scope for the selected channel"
        required: true
        default: "staging-only"
        type: choice
        options:
          - staging-only
          - next-promotion-approved
          - ga-approved
      tag:
        description: "Existing immutable tag exactly matching the selected package version and protected-main commit"
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.dist_tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Verify canonical main source
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          canonical_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            is_ancestor=true
          else
            is_ancestor=false
          fi
          node scripts/release-workflow-policy.mjs canonical-main \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --canonical-main-sha "$canonical_main_sha" \
            --is-ancestor "$is_ancestor"
          package_version="$(node -p "require('./package.json').version")"
          tag_commit="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"
          node scripts/release-workflow-policy.mjs tag-source \
            --tag "$TAG_NAME" \
            --version "$package_version" \
            --sha "$GITHUB_SHA" \
            --tag-commit "$tag_commit" \
            --canonical-main-sha "$canonical_main_sha" \
            --is-ancestor "$is_ancestor"

      - name: Setup canonical packer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Show canonical packer toolchain
        run: |
          set -euo pipefail
          test "$(node --version)" = "v20.19.0"
          test "$(npm --version)" = "10.8.2"

      - name: Select observer GitHub CLI
        id: observer-gh
        run: node .github/scripts/prepare-observer-gh-tool.mjs

      - name: Preflight selected observer GitHub CLI
        env:
          PERSONA_HARNESS_OBSERVER_GH: ${{ steps.observer-gh.outputs.path }}
        run: node scripts/preflight-consumer-authority-external-attestation.mjs --json --observer-gh "$PERSONA_HARNESS_OBSERVER_GH"

      - name: Install dependencies
        run: npm ci

      - name: Check docs
        run: npm run check:docs

      - name: Check injection value
        run: npm run check:injection-value

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          PERSONA_HARNESS_OBSERVER_GH: ${{ steps.observer-gh.outputs.path }}
        run: npm run test:repository

      - name: Build
        run: npm run build

      - name: Product smoke
        run: npm run smoke:product-mvp

      - name: Validate publish inputs
        env:
          APPROVAL_SCOPE: ${{ inputs.approval_scope }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "EXPECTED_GIT_HEAD=${GITHUB_SHA}" >> "$GITHUB_ENV"
          node scripts/release-workflow-policy.mjs dist-tag \
            --approval-scope "$APPROVAL_SCOPE" \
            --version "$version" \
            --dist-tag "$DIST_TAG"

          echo "Publishing persona-harness@$version with dist-tag $DIST_TAG"

      - name: Create one canonical package tarball
        run: |
          set -euo pipefail
          package_directory="${RUNNER_TEMP}/persona-harness-canonical-package"
          package_facts="${RUNNER_TEMP}/persona-harness-canonical-package-facts.json"
          test ! -e "$package_directory"
          test ! -e "$package_facts"
          node scripts/canonical-package-packer.mjs --output-directory "$package_directory" > "$package_facts"
          cmp --silent "$package_facts" "$package_directory/package-facts.json"
          test -s "$package_directory/persona-harness-${PACKAGE_VERSION}.tgz"
          echo "CANONICAL_PACKAGE_DIRECTORY=$package_directory" >> "$GITHUB_ENV"
          echo "CANONICAL_PACKAGE_FACTS=$package_facts" >> "$GITHUB_ENV"
          echo "CANONICAL_TARBALL=$package_directory/persona-harness-${PACKAGE_VERSION}.tgz" >> "$GITHUB_ENV"

      - name: Setup canonical tar publisher Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Show canonical tar publisher toolchain
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Reserve isolated canonical tar publisher environment
        run: |
          set -euo pipefail
          publisher_directory="${RUNNER_TEMP}/persona-harness-canonical-tar-publisher"
          test ! -e "$publisher_directory"
          install -d -m 700 "$publisher_directory" "$publisher_directory/npm-home" "$publisher_directory/npm-cache"
          install -m 600 /dev/null "$publisher_directory/npm-userconfig"
          install -m 600 /dev/null "$publisher_directory/npm-globalconfig"
          echo "PUBLISHER_RUNTIME_DIRECTORY=$publisher_directory" >> "$GITHUB_ENV"
          echo "PUBLISHER_NPM_HOME=$publisher_directory/npm-home" >> "$GITHUB_ENV"
          echo "PUBLISHER_NPM_CACHE=$publisher_directory/npm-cache" >> "$GITHUB_ENV"
          echo "PUBLISHER_NPM_GLOBALCONFIG=$publisher_directory/npm-globalconfig" >> "$GITHUB_ENV"
          echo "PUBLISHER_NPM_USERCONFIG=$publisher_directory/npm-userconfig" >> "$GITHUB_ENV"

      - name: Preflight canonical tar publisher handoff
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          export HOME="$PUBLISHER_NPM_HOME"
          export NPM_CONFIG_CACHE="$PUBLISHER_NPM_CACHE"
          export NPM_CONFIG_GLOBALCONFIG="$PUBLISHER_NPM_GLOBALCONFIG"
          export NPM_CONFIG_USERCONFIG="$PUBLISHER_NPM_USERCONFIG"
          node scripts/canonical-package-publisher.mjs \
            --canonical-directory "$CANONICAL_PACKAGE_DIRECTORY" \
            --dist-tag "$DIST_TAG" \
            --package-facts "$CANONICAL_PACKAGE_FACTS" \
            --publisher-runtime-directory "$PUBLISHER_RUNTIME_DIRECTORY" \
            --tarball "$CANONICAL_TARBALL" \
            --dry-run true
          npm publish "$CANONICAL_TARBALL" --access public --tag "$DIST_TAG" --provenance --dry-run

      - name: Publish to npm
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          export HOME="$PUBLISHER_NPM_HOME"
          export NPM_CONFIG_CACHE="$PUBLISHER_NPM_CACHE"
          export NPM_CONFIG_GLOBALCONFIG="$PUBLISHER_NPM_GLOBALCONFIG"
          export NPM_CONFIG_USERCONFIG="$PUBLISHER_NPM_USERCONFIG"
          npm publish "$CANONICAL_TARBALL" --access public --tag "$DIST_TAG" --provenance

      - name: Verify registry package
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail

          registry_readback_path="${RUNNER_TEMP}/persona-harness-registry-readback.json"
          test ! -e "$registry_readback_path"
          registry_readback_verified=false
          registry_readback_timeout_seconds=1200
          registry_readback_started_at="$(date +%s)"
          while :; do
            if node scripts/release-registry-readback.mjs \
              --dist-tag "$DIST_TAG" \
              --package-facts "$CANONICAL_PACKAGE_FACTS" \
              --source-head "$EXPECTED_GIT_HEAD" \
              --version "$PACKAGE_VERSION" \
              > "$registry_readback_path"; then
              registry_readback_verified=true
              break
            fi
            registry_readback_elapsed_seconds=$(( $(date +%s) - registry_readback_started_at ))
            if (( registry_readback_elapsed_seconds >= registry_readback_timeout_seconds )); then
              break
            fi
            registry_readback_remaining_seconds=$(( registry_readback_timeout_seconds - registry_readback_elapsed_seconds ))
            registry_readback_sleep_seconds=$(( registry_readback_remaining_seconds < 10 ? registry_readback_remaining_seconds : 10 ))
            echo "Waiting for npm registry package metadata; ${registry_readback_elapsed_seconds}s elapsed..."
            sleep "$registry_readback_sleep_seconds"
          done

          test -s "$registry_readback_path"
          test "$registry_readback_verified" = true

      - name: Upload sanitized registry readback
        id: registry-evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-registry-readback-${{ env.PACKAGE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/persona-harness-registry-readback.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## npm publish verified"
            echo
            echo "- package: persona-harness@${PACKAGE_VERSION}"
            echo "- workflow source head: ${EXPECTED_GIT_HEAD}"
            echo "- dist-tag: ${{ inputs.dist_tag }}"
            echo "- approval scope: ${{ inputs.approval_scope }}"
            echo "- registry evidence artifact id: ${{ steps.registry-evidence.outputs.artifact-id }}"
            echo "- registry evidence artifact digest: ${{ steps.registry-evidence.outputs.artifact-digest }}"
            echo
            echo "### Sanitized registry package readback"
            echo '```json'
            if test -s "${RUNNER_TEMP}/persona-harness-registry-readback.json"; then
              cat "${RUNNER_TEMP}/persona-harness-registry-readback.json"
            else
              echo '{"status":"blocked","diagnostics":["release-registry-readback-unavailable"]}'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
