name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable stable release tag matching the current package version"
        required: true
        type: string
      approval_scope:
        description: "Required explicit approval scope for GitHub release creation"
        required: true
        default: "ga-approved"
        type: choice
        options:
          - ga-approved

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify approved stable release source
    if: github.repository == 'jyt6640/persona-harness' && github.ref == 'refs/heads/main' && inputs.approval_scope == 'ga-approved'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Verify approved release source
        env:
          APPROVAL_SCOPE: ${{ inputs.approval_scope }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = jyt6640/persona-harness
          git fetch origin main --tags
          package_version="$(node -p "require('./package.json').version")"
          canonical_main_sha="$(git rev-parse refs/remotes/origin/main)"
          tag_commit="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"
          if git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            is_ancestor=true
          else
            is_ancestor=false
          fi
          node scripts/release-workflow-policy.mjs tag-source \
            --tag "$TAG_NAME" \
            --version "$package_version" \
            --sha "$tag_commit" \
            --tag-commit "$tag_commit" \
            --canonical-main-sha "$canonical_main_sha" \
            --is-ancestor "$is_ancestor"
          node scripts/release-workflow-policy.mjs dist-tag \
            --approval-scope "$APPROVAL_SCOPE" \
            --version "$package_version" \
            --dist-tag latest

      - name: Setup canonical packer Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Show canonical packer toolchain
        run: |
          set -euo pipefail
          test "$(node --version)" = "v20.19.0"
          test "$(npm --version)" = "10.8.2"

      - name: Select observer GitHub CLI
        id: observer-gh
        run: node .github/scripts/prepare-observer-gh-tool.mjs

      - name: Preflight selected observer GitHub CLI
        env:
          PERSONA_HARNESS_OBSERVER_GH: ${{ steps.observer-gh.outputs.path }}
        run: node scripts/preflight-consumer-authority-external-attestation.mjs --json --observer-gh "$PERSONA_HARNESS_OBSERVER_GH"

      - name: Install dependencies
        run: npm ci

      - name: Test
        env:
          PERSONA_HARNESS_OBSERVER_GH: ${{ steps.observer-gh.outputs.path }}
        run: npm run test:repository

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Rule diagnostics
        run: npm run report:rules

      - name: Scope check
        run: npm run check:scope:strict

      - name: Injection value check
        run: npm run check:injection-value

      - name: GitHub release notes check
        run: npm run check:github-release-notes

      - name: Create one canonical package tarball
        run: |
          set -euo pipefail
          package_directory="${RUNNER_TEMP}/persona-harness-canonical-package"
          package_facts="${RUNNER_TEMP}/persona-harness-canonical-package-facts.json"
          package_version="$(node -p "require('./package.json').version")"
          test ! -e "$package_directory"
          test ! -e "$package_facts"
          node scripts/canonical-package-packer.mjs --output-directory "$package_directory" > "$package_facts"
          cmp --silent "$package_facts" "$package_directory/package-facts.json"
          test -s "$package_directory/persona-harness-${package_version}.tgz"
          echo "CANONICAL_PACKAGE_DIRECTORY=$package_directory" >> "$GITHUB_ENV"
          echo "CANONICAL_PACKAGE_FACTS=$package_facts" >> "$GITHUB_ENV"
          echo "CANONICAL_TARBALL=$package_directory/persona-harness-${package_version}.tgz" >> "$GITHUB_ENV"

      - name: Setup canonical tar publisher Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Show canonical tar publisher toolchain
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Reserve isolated canonical tar publisher environment
        run: |
          set -euo pipefail
          publisher_directory="${RUNNER_TEMP}/persona-harness-canonical-tar-publisher"
          test ! -e "$publisher_directory"
          install -d -m 700 "$publisher_directory" "$publisher_directory/npm-home" "$publisher_directory/npm-cache"
          install -m 600 /dev/null "$publisher_directory/npm-userconfig"
          install -m 600 /dev/null "$publisher_directory/npm-globalconfig"
          echo "PUBLISHER_RUNTIME_DIRECTORY=$publisher_directory" >> "$GITHUB_ENV"
          echo "PUBLISHER_NPM_HOME=$publisher_directory/npm-home" >> "$GITHUB_ENV"
          echo "PUBLISHER_NPM_CACHE=$publisher_directory/npm-cache" >> "$GITHUB_ENV"
          echo "PUBLISHER_NPM_GLOBALCONFIG=$publisher_directory/npm-globalconfig" >> "$GITHUB_ENV"
          echo "PUBLISHER_NPM_USERCONFIG=$publisher_directory/npm-userconfig" >> "$GITHUB_ENV"

      - name: Preflight canonical tar publisher handoff
        run: |
          set -euo pipefail
          export HOME="$PUBLISHER_NPM_HOME"
          export NPM_CONFIG_CACHE="$PUBLISHER_NPM_CACHE"
          export NPM_CONFIG_GLOBALCONFIG="$PUBLISHER_NPM_GLOBALCONFIG"
          export NPM_CONFIG_USERCONFIG="$PUBLISHER_NPM_USERCONFIG"
          node scripts/canonical-package-publisher.mjs \
            --canonical-directory "$CANONICAL_PACKAGE_DIRECTORY" \
            --dist-tag latest \
            --package-facts "$CANONICAL_PACKAGE_FACTS" \
            --publisher-runtime-directory "$PUBLISHER_RUNTIME_DIRECTORY" \
            --tarball "$CANONICAL_TARBALL" \
            --dry-run true
          npm publish "$CANONICAL_TARBALL" --access public --tag latest --provenance --dry-run

  github-release:
    name: Create approved GitHub release notes
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.approval_scope == 'ga-approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Generate release body
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: node scripts/generate-github-release-notes.mjs --tag "$TAG_NAME" --out github-release-notes.md

      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"
          if gh release view "$TAG_NAME" \
            --json tagName,name,isPrerelease,targetCommitish \
            > existing-release.json 2> release-view-error.txt; then
            :
          else
            if ! grep -Eiq "404|not found" release-view-error.txt; then
              exit 1
            fi
            gh release create "$TAG_NAME" \
              --target "$tag_commit" \
              --notes-file github-release-notes.md \
              --title "$TAG_NAME"
            gh release view "$TAG_NAME" \
              --json tagName,name,isPrerelease,targetCommitish \
              > existing-release.json
          fi
          node scripts/release-workflow-policy.mjs release-state \
            --release existing-release.json \
            --tag "$TAG_NAME" \
            --tag-commit "$tag_commit" \
            --expected-commit "$tag_commit" \
            --expected-prerelease false
